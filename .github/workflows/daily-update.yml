name: daily-data-update

on:
  schedule:
    # 00:30 UTC — shortly after the daily candle closes
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run data:update

      - run: npm run data:assets

      - run: npm run data:external
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - run: npm run data:fred
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - run: npm run data:derivs

      - run: npm run data:mcaps

      - run: npm run data:onchain

      - run: npm run data:equities
        continue-on-error: true

      - run: npm run data:stables
        continue-on-error: true

      - name: data:sec (Mondays only)
        # Optional: SEC's fair-access policy wants a working contact in the
        # User-Agent. Unset falls back to the project's repository URL.
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run data:sec || echo "data:sec failed; keeping stale shares.json"
          else
            echo "Not Monday; skipping data:sec."
          fi

      - run: npm run data:compute

      - run: npm run data:compute-assets

      - run: npm run data:compute-stables

      - run: npm run data:compute-cross

      - run: npm run data:compute-onchain

      - run: npm run docs:generate

      - name: Commit and push if data changed
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "burrito-bot"
          git config user.email "actions@github.com"
          git add data/ docs/ public/burrito-vault.zip
          git commit -m "data: daily update $(date -u +%F)"
          git push

  deploy:
    needs: update
    # Always attempt this, even when `update` exited early on "No data
    # changes" (still success, but this makes the intent explicit) — the
    # cron and workflow_dispatch triggers should redeploy regardless. Guard
    # on the Cloudflare secrets existing so the job no-ops cleanly before
    # they're configured instead of failing.
    if: always() && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `update` may have just pushed a new commit to main; build from
          # that, not the commit that triggered this workflow.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
